<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">SOR Hosting · Propuesta de login</title><desc id="desc">Mockup estático de SOR Hosting. Todos los datos son ilustrativos. Colores sólidos sin degradados.</desc>
