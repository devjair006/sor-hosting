components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-sor_session
  schemas:
    User:
      type: object
      properties:
        id: *id002
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - admin
      required:
      - id
      - email
      - role
    Job:
      type: object
      properties:
        id: *id002
        kind: *id001
        resource_id: *id001
        state:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - interrupted
        phase: *id001
        error_code: *id001
        created_at: &id005
          type: string
          format: date-time
        updated_at: *id005
      required:
      - id
      - kind
      - resource_id
      - state
      - phase
      - error_code
      - created_at
      - updated_at
    JobResponse:
      type: object
      properties:
        job:
          $ref: '#/components/schemas/Job'
      required:
      - job
    Site:
      type: object
      properties:
        id: *id002
        server_id: *id001
        name: *id001
        domain: *id001
        state:
          type: string
          enum:
          - provisioning
          - pending_dns
          - pending_ssl
          - active
          - failed
          - restoring
        metadata: *id001
        availability:
          type: boolean
          nullable: true
        created_at: *id005
        updated_at: *id005
        management:
          type: string
          enum:
          - managed
          - external
        lifecycle:
          type: string
          enum:
          - present
          - deleting
          - deleted
        can_delete:
          type: boolean
        can_backup:
          type: boolean
      required:
      - id
      - server_id
      - name
      - domain
      - state
      - metadata
      - availability
      - created_at
      - updated_at
    Container:
      type: object
      properties:
        id: *id002
        name: *id001
        image: *id001
        state: *id001
        status: *id001
        managed: *id006
        can_manage: *id006
        can_read_logs: *id006
        protected: *id006
        site_id: *id001
        cpu_pct:
          type: number
          nullable: true
        memory_bytes:
          type: number
          nullable: true
      required:
      - id
      - name
      - image
      - state
      - status
      - managed
      - can_manage
      - can_read_logs
      - protected
      - site_id
      - cpu_pct
      - memory_bytes
    Domain:
      type: object
      properties:
        id: *id002
        site_id: *id002
        hostname: *id001
        dns_state: *id001
        metadata: *id001
        created_at: *id005
      required:
      - id
      - site_id
      - hostname
      - dns_state
      - metadata
      - created_at
    Certificate:
      type: object
      properties:
        id: *id002
        domain_id: *id002
        cert_name: *id001
        expires_at: *id001
        metadata: *id001
      required:
      - id
      - domain_id
      - cert_name
      - expires_at
      - metadata
    Backup:
      type: object
      properties:
        id: *id002
        site_id: *id002
        state:
          type: string
          enum:
          - ready
          - failed
        size_bytes:
          type: integer
        checksum: *id001
        metadata: *id001
        created_at: *id005
      required:
      - id
      - site_id
      - state
      - size_bytes
      - checksum
      - metadata
      - created_at
    AuditEvent:
      type: object
      properties:
        id: *id002
        user_id: *id001
        action: *id001
        resource_id: *id001
        outcome: *id001
        created_at: *id005
      required:
      - id
      - user_id
      - action
      - resource_id
      - outcome
      - created_at
    APIError:
      type: object
      properties:
        error:
          type: object
          properties:
            code: *id001
            message: *id001
            request_id: *id001
          required:
          - code
          - message
          - request_id
      required:
      - error
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          maxLength: 128
      required:
      - email
      - password
    PasswordInput:
      type: object
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
      required:
      - current_password
      - new_password
    InstallInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        domain: *id001
        admin_email:
          type: string
          format: email
        admin_password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
        wordpress_title:
          type: string
          minLength: 1
          maxLength: 200
        resources:
          type: object
          properties:
            memory_mb:
              type: integer
              minimum: 256
              maximum: 16384
            cpu_limit:
              type: number
              minimum: 0.25
              maximum: 16
          required:
          - memory_mb
          - cpu_limit
      required:
      - name
      - domain
      - admin_email
      - admin_password
      - wordpress_title
      - resources
    AdoptInput:
      type: object
      properties:
        name: *id001
        domain: *id001
        web_container_id: *id002
        database_container_id: *id002
        writer_container_ids:
          type: array
          items: *id002
        database_secret_ref: *id002
      required:
      - name
      - domain
      - web_container_id
      - database_container_id
      - writer_container_ids
      - database_secret_ref
    DomainInput:
      type: object
      properties:
        site_id: *id002
        hostname: *id001
      required:
      - site_id
      - hostname
    ContainerInput:
      type: object
      properties:
        action:
          type: string
          enum:
          - start
          - stop
          - restart
      required:
      - action
    BackupInput:
      type: object
      properties:
        confirm_maintenance:
          type: boolean
          enum:
          - true
      required:
      - confirm_maintenance
    RestoreInput:
      type: object
      properties:
        confirm_domain: *id001
        confirm_maintenance:
          type: boolean
          enum:
          - true
      required:
      - confirm_domain
      - confirm_maintenance
    Series:
      type: object
      properties:
        name: *id001
        unit: *id001
        points:
          type: array
          items:
            type: object
            properties:
              timestamp:
                type: number
              value:
                type: number
                nullable: true
            required:
            - timestamp
            - value
      required:
      - name
      - unit
      - points
    Monitoring:
      type: object
      properties:
        series:
          type: array
          items:
            $ref: '#/components/schemas/Series'
        observed_at: *id001
        stale: *id006
      required:
      - series
      - observed_at
      - stale
    Settings:
      type: object
      properties:
        server:
          type: object
          properties:
            id: *id001
            name: *id001
        integrations:
          type: object
          properties:
            agent: *id006
            prometheus: *id006
          required:
          - agent
          - prometheus
        backup_destination: *id001
      required:
      - server
      - integrations
      - backup_destination
    Dashboard:
      type: object
      properties:
        server:
          type: object
        metrics:
          type: object
          properties:
            cpu:
              type: number
              nullable: true
            memory_pct:
              type: number
              nullable: true
            memory_used:
              type: number
              nullable: true
            memory_total:
              type: number
              nullable: true
            disk_used:
              type: number
              nullable: true
            disk_total:
              type: number
              nullable: true
            traffic:
              type: number
              nullable: true
        services:
          type: array
          items:
            type: object
            properties:
              name: *id001
              available: *id006
            required:
            - name
            - available
        sites:
          type: array
          items:
            $ref: '#/components/schemas/Site'
        recent_activity:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        observed_at: *id001
      required:
      - server
      - metrics
      - services
      - sites
      - recent_activity
      - observed_at
    SitePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Site'
        next_cursor:
          type: string
          nullable: true
      required:
      - items
      - next_cursor
    ContainerPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Container'
        next_cursor:
          type: string
          nullable: true
      required:
      - items
      - next_cursor
    DomainPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Domain'
        next_cursor:
          type: string
          nullable: true
      required:
      - items
      - next_cursor
    CertificatePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Certificate'
        next_cursor:
          type: string
          nullable: true
      required:
      - items
      - next_cursor
    BackupPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Backup'
        next_cursor:
          type: string
          nullable: true
      required:
      - items
      - next_cursor
    AuditEventPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        next_cursor:
          type: string
          nullable: true
      required:
      - items
      - next_cursor
    ExternalInput:
      type: object
      additionalProperties: false
      required:
      - name
      - domain
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        domain:
          type: string
        web_container_id:
          type: string
          pattern: ^[a-f0-9]{64}$
        database_container_id:
          type: string
          pattern: ^[a-f0-9]{64}$
    DeleteInput:
      type: object
      additionalProperties: false
      required:
      - confirm_domain
      - keep_backups
      properties:
        confirm_domain:
          type: string
          description: Debe coincidir exactamente con el dominio del sitio.
        keep_backups:
          type: boolean
          description: Conserva todos los backups, incluido el backup de seguridad
            creado para esta eliminación.
