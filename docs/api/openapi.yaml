openapi: 3.0.3
info:
  title: SOR Hosting API
  version: 0.1.0
  description: API privada. Cookies de sesión y CSRF; agente local separado. La configuración
    sensible no se edita por navegador.
servers:
- url: /api/v1
security:
- session: []
paths:
  /auth/login:
    post:
      summary: Iniciar sesión
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                required:
                - user
        '401':
          description: Sin sesión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '403':
          description: Solicitud o recurso no autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '409':
          description: Conflicto o recurso ocupado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '422':
          description: Validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '503':
          description: Integración no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      security: []
      parameters:
      - name: Origin
        in: header
        required: true
        schema: &id001
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
  /auth/me:
    get:
      summary: Consultar sesión
      responses:
        '200':
          description: Respuesta correcta
          content:
