name: SOR Hosting CI and delivery
on:
  pull_request:
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the tested image to the protected VPS environment
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: sor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.x'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: ./tools/bootstrap.sh
      - run: make check build
      - run: python3 tools/check-schema.py
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e --prefix frontend
      - run: npm run test:live --prefix frontend
      - run: bash tools/test-docker.sh
      - run: bash tools/test-docker-edge.sh
      - name: Validate Compose
        env:
          SOR_ORIGIN: https://panel.example.com
          SOR_SECRET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: docker compose -f deploy/compose.yaml config --quiet
      - name: Build panel image
        run: docker build -f deploy/Dockerfile --target panel -t sor-hosting:verified .
  agent-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Generate typed queries and test agent
        run: |
          mkdir -p .tools/bin
          GOBIN="$PWD/.tools/bin" GOWORK=off go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.29.0
          .tools/bin/sqlc generate -f agent/sqlc.yaml
          cd agent
          go test ./... -count=1
          go vet ./...
      - name: Build Linux amd64 agent and checksum
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p bin/release
          cd agent
          go build -trimpath -ldflags='-s -w' -o ../bin/release/sor-agent-linux-amd64 ./cmd/agent
          cd ../bin/release
          sha256sum sor-agent-linux-amd64 > SHA256SUMS
          printf 'commit=%s\nplatform=linux/amd64\n' "$GITHUB_SHA" > BUILD.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sor-agent-linux-amd64
          path: bin/release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build and publish immutable image
        id: push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}:$REVISION"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
          docker build -f deploy/Dockerfile --target panel -t "$image" .
          docker push "$image"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")
          printf 'image=%s\n' "$digest" >> "$GITHUB_OUTPUT"
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: publish
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Deploy through verified SSH host
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9_./-]+$ ]]
          [[ "$IMAGE" =~ ^ghcr.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]
          umask 077
          sshdir=$(mktemp -d)
          trap 'rm -rf "$sshdir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$sshdir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$sshdir/known_hosts"
          ssh -i "$sshdir/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$sshdir/known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && SOR_IMAGE='$IMAGE' ./deploy/release.sh"
